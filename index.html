<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>플러스기획 워크플로우</title>
<meta name="theme-color" content="#FAF6EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플러스기획 워크플로우">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF6EE; --sub:#F2ECDF; --paper:#FFFFFF; --ink:#1A1A17; --ink2:#4A4740; --ink3:#706B61; --line:#E8DFCF;
  --cover:#0B7A4B; --accent:#0B8A55; --accent-soft:#E3F4EB; --gold:#B45309; --gold-soft:#FEF0D9;
  --rose:#BE185D; --rose-soft:#FCE7F1; --blue:#2563EB; --blue-soft:#E6EEFE; --fail:#DC2626; --fail-soft:#FDE6E6;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side{display:none}
.top{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-block}
.topbtns{display:flex;gap:6px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--ink);background:var(--paper)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;margin:0}
main{min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--ink3)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs .rdot{position:absolute;top:6px;left:calc(50% + 8px)}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--fail);display:inline-block}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(11,122,75,.35);z-index:21}
.fab svg{width:26px;height:26px}
@media(min-width:960px){
  .top,nav.tabs{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:232px;padding:22px 14px;border-right:1px solid var(--line);background:var(--bg);gap:2px;z-index:15;overflow:auto}
  main{margin-left:232px}
  .wrap{padding:28px 32px 90px}
  .fab{bottom:28px;right:32px}
}
.side .brand{padding:0 10px 18px}
.side .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:500;width:100%}
.side .nav svg{width:20px;height:20px;flex:none}
.side .nav.on{background:var(--paper);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.side .gap{height:14px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:14px;border-top:1px solid var(--line)}
.me-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13.5px}
.me-chip small{display:block;color:var(--ink3);font-size:12px}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--fail);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-left:auto}
.av{width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:-.04em}
.av.sm{width:22px;height:22px;font-size:9.5px}
.avs{display:flex}.avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--paper)}.avs .av:first-child{margin-left:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--accent)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.sec-h h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.meta{font-size:12px;color:var(--ink3)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px rgba(16,24,40,.05);overflow:hidden}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.empty{padding:18px 16px;color:var(--ink2);font-size:14px;text-align:center}
.g2{display:grid;gap:22px}
.col2{display:flex;flex-direction:column;gap:22px;min-width:0}
@media(min-width:960px){.g2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink2)}
.stat b small{font-size:15px;color:var(--ink3);font-weight:600}
.stat.red b{color:var(--fail)}.stat.amber b{color:var(--gold)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grp{font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--sub);padding:7px 14px;display:flex;justify-content:space-between}
.grp.red{color:var(--fail)}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.tck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--ink3);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.tck svg{width:15px;height:15px}
.trow.done .tck{background:var(--accent);border-color:var(--accent)}
.tmain{min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left}
.tname{font-weight:500;overflow-wrap:anywhere}
.trow.done .tname{text-decoration:line-through;color:var(--ink3)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--ink2);align-items:center}
.mi{display:inline-flex;align-items:center;gap:4px}
.tright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:80px}
.due{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.due.late{color:var(--fail)}.due.soon{color:var(--gold)}
.mini-prog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.mini-prog .prog{width:56px}
.exp{font-size:12px;color:var(--blue);font-weight:600}
.cklist{padding:0 14px 12px 50px;display:flex;flex-direction:column}
.ckit{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0;text-align:left;min-width:0}
.ckit .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink3);display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ckit .bx svg{width:12px;height:12px}
.ckit.on .bx{background:var(--accent);border-color:var(--accent)}
.ckit.on .tx{color:var(--ink3);text-decoration:line-through}
.ckrow{display:flex;align-items:center;gap:6px}
.ckrow .ckit{flex:1}
.pad{padding-left:14px;padding-right:10px}
.xbtn{width:30px;height:30px;border-radius:8px;color:var(--ink3);display:inline-flex;align-items:center;justify-content:center;flex:none}
.xbtn svg{width:16px;height:16px}
.addrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;padding-bottom:10px}
.addrow .inp{flex:1;min-width:140px}
.chip{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.todo{background:var(--sub);color:var(--ink2)}
.chip.doing{background:var(--blue-soft);color:var(--blue)}
.chip.hold{background:var(--gold-soft);color:var(--gold)}
.chip.done{background:var(--accent-soft);color:var(--accent)}
.chip.line{border:1px solid var(--line);color:var(--ink2);font-weight:500}
.chip.red{background:var(--fail-soft);color:var(--fail)}
.pdot{width:8px;height:8px;border-radius:3px;display:inline-block;flex:none}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog.gold>i{background:var(--gold)}
.btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:500;font-size:14px}
.btn.pri{background:var(--cover);color:#fff;border-color:var(--cover)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--fail);border-color:var(--fail)}
.btn.danger.arm{background:var(--fail);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns.end{justify-content:flex-end}
.link{color:var(--accent);font-size:14px;font-weight:600;padding:4px 2px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.navc{display:flex;align-items:center;gap:10px}
.lbl{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--paper)}
.arrow svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 16px;border-radius:8px;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--cover);color:#fff;font-weight:600}
.pickwrap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.pick{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;max-width:180px}
.lrow{display:flex;align-items:center;gap:8px;padding:10px 14px;width:100%;text-align:left;font-size:14px;flex-wrap:wrap}
.lrow .t{flex:1;min-width:0;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--ink2);line-height:1.6}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--blue-soft);font-size:13.5px}
/* reminder */
.remind{border:1.5px solid var(--gold);background:#FFFBF2}
.remind .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;flex-wrap:wrap}
.remind .rh b{font-size:15.5px}
.remind .ritem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;text-align:left;width:100%;font-size:14px}
.remind .ritem .k{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.remind.ok{border-color:var(--accent);background:var(--accent-soft)}
/* projects */
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pcard{padding:14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:10px}
.pcard .ph{display:flex;align-items:center;gap:8px}
.pcard .ph h3{margin:0;font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.dd{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-variant-numeric:tabular-nums}
.pstat{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.pstat b{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tl{padding:16px 14px 14px}
.tl .bar{position:relative;height:10px;border-radius:5px;background:var(--line);margin:24px 0 8px}
.tl .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;opacity:.35}
.tl .bar .ms{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--paper)}
.tl .bar .now{position:absolute;top:-20px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.tl .bar .now span{position:absolute;top:-2px;left:4px;font-size:10.5px;white-space:nowrap;font-weight:600}
.tl .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.alloc{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,52px) minmax(90px,1fr);gap:8px;align-items:center;padding:10px 14px;font-size:13.5px;text-align:left;width:100%}
.alloc .who{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.alloc.h{font-size:12px;color:var(--ink3);font-weight:600;padding-block:8px}
.alloc .n{text-align:center;font-variant-numeric:tabular-nums}
.alloc.sel{background:var(--accent-soft)}
@media(max-width:560px){.alloc{grid-template-columns:minmax(0,1fr) repeat(3,34px) 70px;gap:6px}}
.board{display:grid;gap:12px}
@media(min-width:960px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bcol{background:var(--sub);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bcol h4{margin:0 2px 2px;font-size:13.5px;display:flex;justify-content:space-between}
.kc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.kc.late{border-color:var(--fail)}
.hrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:10px 14px;text-align:left;width:100%;font-size:14px}
.hd{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink3);font-size:12.5px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);align-self:flex-start}
.back svg{width:16px;height:16px}
/* meetings */
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%}
.mdate b{display:block;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
.mdate span{font-size:12px;color:var(--ink2)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.step small{font-size:12px;color:var(--ink3);font-weight:600}
.step b{font-size:14.5px}
.step.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.ok small{color:var(--accent)}
.sect{padding:14px;display:flex;flex-direction:column;gap:6px}
.sect label{font-size:13px;font-weight:700;color:var(--accent)}
.arow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;padding:10px 14px;align-items:center;text-align:left;width:100%}
@media(max-width:640px){.arow{grid-template-columns:1fr 1fr}.arow .t{grid-column:1/-1}}
.inp{background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0;font-size:14px}
textarea.inp{min-height:84px;resize:vertical;line-height:1.6}
/* calendar */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.fchip{border:1px solid var(--line);padding:4px 12px;border-radius:99px;font-size:13px;background:var(--paper);color:var(--ink2)}
.fchip.on.lv{background:var(--gold-soft);color:var(--gold);border-color:transparent;font-weight:600}
.fchip.on.mt{background:var(--blue-soft);color:var(--blue);border-color:transparent;font-weight:600}
.fchip.on.du{background:var(--fail-soft);color:var(--fail);border-color:transparent;font-weight:600}
.mcal .dow,.mcal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mcal .dow span{text-align:center;font-size:12px;font-weight:600;color:var(--ink2);padding:8px 0}
.cell{min-height:66px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden;cursor:pointer}
.cell:nth-child(7n+1){border-left:0}
@media(min-width:960px){.cell{min-height:100px;padding:6px}}
.cell .n{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cell.out{opacity:.4}.cell.sun .n{color:var(--rose)}.cell.sat .n{color:var(--blue)}
.cell.today .n{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cell.sel{background:var(--accent-soft)}
.ev{font-size:11px;line-height:1.35;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev.lv{background:var(--gold-soft);color:var(--gold)}.ev.mt{background:var(--blue-soft);color:var(--blue)}.ev.du{background:var(--fail-soft);color:var(--fail)}.ev.pj{background:var(--accent-soft);color:var(--accent)}
.more{font-size:11px;color:var(--ink3)}
@media(max-width:600px){.ev{font-size:9.5px;padding:0 3px}}
/* log */
.lsec{padding:12px 16px}
.lsec h4{margin:0 0 6px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center}
.lsec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.auto{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:6px;margin-left:6px}
.dayh{padding:10px 16px;background:var(--sub);font-weight:700;font-size:14px;display:flex;justify-content:space-between}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:960px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88vh;padding-top:16px}.grab{display:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;margin-bottom:2px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-head h3{margin:0;font-size:19px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink2);font-weight:500;min-width:0}

function summarize(k,a,b){

      if(po&&!changedKeys(po,x).length&&!forceVer.has(k+'/'+x.id)){ops.push(['set',k,x.id,s]);sy[x.id]=s;return}

    base[k]=sy;
  }

  S.changes.forEach(x=>{const s=JSON.stringify(x);cur[x.id]=s;if(sy[x.id]!==s)ops.push(['set','changes',x.id,s])});
  Object.keys(sy).forEach(id=>{if(!(id in cur))ops.push(['del','changes',id])});

  if((m=tok.match(/^(\d{1,2})[\/.](\d{1,2})$/)||tok.match(/^(\d{1,2})월(\d{1,2})일$/))){const mo=+m[1],dd=+m[2];if(mo<1||mo>12||dd<1||dd>31)return null;let y=d0.getFullYear(),r=`${y}-${pad(mo)}-${pad(dd)}`;if(r<addDays(T,-60))r=`${y+1}-${pad(mo)}-${pad(dd)}`;return r}

/* 프로젝트 이름이 조금 달라도 찾기: 포함 > 글자 순서 일치 > 두 글자 묶음 유사도 */

function nameSim(a,b){

  if(a.length>=3){let i=0;for(const ch of b){if(ch===a[i])i++;if(i===a.length)break}if(i===a.length)return .7}
  const g=x=>{const o=[];for(let i=0;i<x.length-1;i++)o.push(x.slice(i,i+2));return o},A=g(a),B=g(b);if(!A.length||!B.length)return 0;

function matchProject(toks,min){
  const ps=S.projects.filter(p=>p.status!=='done');let best=null;
  for(let k=Math.min(toks.length-1,6);k>=1;k--){const c=nrm(toks.slice(0,k).join(''));if(c.length<2)continue;let top=null;

function parseQuick(line,pid,defWho){

    extra.forEach(seg=>{if(!who&&/^[가-힣]{2,5}$/.test(seg)){who=defWho;warn.push(`담당자 '${seg}'을(를) 못 찾아 ${mname(defWho)}(으)로 등록`)}else title+=', '+seg});

}

function gRender(text){
  let h='',lst='';const close=()=>{if(lst){h+=`</${lst}>`;lst=''}};
  const inl=x=>esc(x).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  String(text||'').split('\n').forEach(l=>{const t=l.trim();let m;
    if(!t){close();return}
    if(t.startsWith('## ')){close();h+=`<h4>${inl(t.slice(3))}</h4>`;return}
    if(t.startsWith('- ')){if(lst!=='ul'){close();h+='<ul>';lst='ul'}h+=`<li>${inl(t.slice(2))}</li>`;return}
    if((m=t.match(/^\d+\.\s+(.*)$/))){if(lst!=='ol'){close();h+='<ol>';lst='ol'}h+=`<li>${inl(m[1])}</li>`;return}
    close();h+=`<p>${inl(t)}</p>`});
  close();return h;
}

function parsePlan(items){return items.map(x=>{let t=String(x).trim(),rev=false,role='PM';
  if(t.startsWith('★')){rev=true;t=t.slice(1).trim()}
  const r=t.match(/\s+@(PM|담당자?)$/i);if(r){role=/pm/i.test(r[1])?'PM':'담당';t=t.slice(0,r.index).trim()}
  const m=t.match(/^D\s*([+-])\s*(\d+)\s+(.+)$/i);if(m)return{off:(m[1]==='-'?-1:1)*+m[2],title:m[3].trim(),rev,role};
  const z=t.match(/^D-?day\s+(.+)$/i);return z?{off:0,title:z[1].trim(),rev,role}:null}).filter(Boolean)}
function addPlanTasks(p){
  const T=today(),pm=p.owner||me(),st=p.staff||pm;let n=0,skip=0;const ex=new Set(S.tasks.filter(t=>t.projectId===p.id).map(t=>t.title));
  parsePlan(tpl('eventPlan').items).forEach(x=>{const due=addDays(p.end,x.off);if(ex.has(x.title))return;if(due<T){skip++;return}
    const who=x.role==='담당'?st:pm;S.tasks.push(mkTask({title:x.title,projectId:p.id,assignee:who,due,reviewer:x.rev&&who!==pm?pm:'',src:'표준 일정에서 생성'}));n++});
  return {n,skip};
}

function shrink(file,max,q){return new Promise((ok,no)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const s0=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s0);c.height=Math.round(img.naturalHeight*s0);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let d=c.toDataURL('image/jpeg',q);if(d.length>800000)d=c.toDataURL('image/jpeg',.5);ok(d)};img.onerror=()=>{URL.revokeObjectURL(url);no()};img.src=url})}

/* versions */
function fmtVal(k,f,v){
  if(v==null||v==='')return '—';
  if(f==='assignee'||f==='owner'||f==='host'||f==='member'||f==='updatedBy')return mname(v);
  if(f==='attendees')return v.map(mname).join(', ');
  if(f==='projectId'){const p=proj(v);return p?p.name:'(삭제된 프로젝트)'}
  if(f==='status')return ST[v]||({active:'진행 중',pending:'승인 대기',approved:'승인',rejected:'반려'}[v])||v;
  if(f==='checklist')return v.map(c=>(c.done?'☑ ':'☐ ')+c.text).join('\n')||'—';
  if(f==='report')return v.map(r=>`[${r.k}] ${r.v||'-'}`).join('\n');
  if(f==='actions')return v.map(a=>`${a.title} — ${mname(a.assignee)}${a.due?' · '+md(a.due):''}`).join('\n')||'—';
  if(f==='items')return v.join('\n');
  if(f==='site')return v.map(x=>`[${x.k}]${x.ok?' ✓':''} ${x.v||'-'}`).join('\n')||'—';
  if(f==='kind')return v==='internal'?'회의':'현장답사·미팅';
  if(f==='sub')return v==='meet'?'미팅':v==='visit'?'현장답사':'—';
  if(f==='notes')return Object.entries(v).filter(([,x])=>x).map(([a,b])=>`[${a}] ${b}`).join('\n')||'—';
  if(f==='progress')return v+'%';
  if(f==='updatedAt'||f==='at')return hm(v);
  if(Array.isArray(v)||typeof v==='object')return JSON.stringify(v).slice(0,200);
  return String(v);
}
function verBody(k,o){const keys=Object.keys(o).filter(f=>!['id','history','sample','color','createdBy','nextAck','prev'].includes(f));
  return `<dl>${keys.map(f=>`<dt>${esc(FL[f]||(f==='updatedAt'?'수정 시각':f==='updatedBy'?'수정한 사람':f))}</dt><dd>${esc(fmtVal(k,f,o[f]))}</dd>`).join('')}</dl>`}

function copyText(text,label){
  const done=()=>toast(`${label} 복사했어요.`);
  const fallback=()=>{openSheet(`${head('복사해서 쓰기')}<p class="note" style="margin:0">자동 복사가 막혀 있어요. 아래 글을 전체 선택해서 복사하세요.</p><textarea class="copybox" id="copybox" readonly>${esc(text)}</textarea>`);const b=document.getElementById('copybox');b.focus();b.select()};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}
function download(name,text,type){try{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('파일을 내려받았어요.')}catch(e){toast('이 화면에서는 파일 저장이 막혀 있어요.')}}
function meetText(m){
  const p=proj(m.projectId),hasRep=(m.report||[]).some(r=>r.v&&r.v.trim());
  let o=`■ ${m.title} (${kindLabel(m)})\n일시: ${longD(m.date)} ${m.time||''}\n${p?`프로젝트: ${p.name}\n`:''}${isSite(m)?'담당':'진행'}: ${mname(m.host)}\n참석: ${(m.attendees||[]).map(mname).join(', ')}\n`;
  if(isSite(m)&&(m.site||[]).length){o+=`\n◆ ${kindLabel(m)} 보고\n`;m.site.forEach(x=>o+=`\n[${x.k}]${x.ok?' ✓':''}\n${(x.v||'').trim()||'-'}\n`)}
  if(!isSite(m)||hasRep){if(isSite(m))o+=`\n◆ 회의 기록\n`;(m.report||[]).forEach(r=>o+=`\n[${r.k}]\n${(r.v||'').trim()||'-'}\n`)}
  const a=m.actions||[];if(a.length)o+=`\n[결정 업무]\n`+a.map(x=>`· ${x.title} — ${mname(x.assignee)}, ${x.due?md(x.due)+'까지':'기한 미정'}`).join('\n')+'\n';
  return o;
}

  vers:b=>versSheet(b.dataset.col,b.dataset.id),
  restoreVer:b=>{const c=S.changes.find(x=>x.id===b.dataset.v);if(!c||!c.prev)return;const o=JSON.parse(c.prev),arr=S[c.col];
    const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o);forceVer.add(c.col+'/'+o.id);save();flush();versSheet(c.col,o.id);render();toast(`${hm(c.at)} 버전으로 되돌렸어요. 되돌리기 전 내용도 기록에 남았어요`)},
  reqDelVer:b=>{const c=S.changes.find(x=>x.id===b.dataset.v);if(!c)return;c.delReq={by:me(),at:nowISO()};save();versSheet(c.col,c.doc);toast('관리자에게 삭제 승인을 요청했어요')},
  rejDelVer:b=>{const c=S.changes.find(x=>x.id===b.dataset.v);if(!c)return;delete c.delReq;save();settingsSheet();render()},
  delVer:b=>{if(!isAdmin())return;if(ui.armed!=='ver'+b.dataset.v){ui.armed='ver'+b.dataset.v;b.classList.add('arm');b.textContent='한 번 더 누르면 영구 삭제';return}
    const c=S.changes.find(x=>x.id===b.dataset.v);S.changes=S.changes.filter(x=>x.id!==b.dataset.v);save();toast('버전을 삭제했어요');if(c&&document.querySelector('[data-act=memAdd],[data-act=tplEdit]'))settingsSheet();else if(c)versSheet(c.col,c.doc);render()},
  settings:()=>settingsSheet(),
  notifOn:()=>{try{Notification.requestPermission().then(()=>settingsSheet())}catch(e){toast('이 브라우저는 알림을 지원하지 않아요')}},
  tplEdit:b=>tplSheet(b.dataset.id),
  tplSubmit:b=>{if(!isAdmin())return;const id=b.dataset.id,items=[...new Set(document.getElementById('tp-items').value.split('\n').map(s=>s.trim()).filter(Boolean))],err=document.getElementById('tp-err');
    if(!items.length){err.textContent='항목을 하나 이상 적어 주세요.';err.hidden=false;return}
    if(JSON.stringify(items)===JSON.stringify(tpl(id).items)){err.textContent='바뀐 내용이 없어요.';err.hidden=false;return}
    applyTpl(id,items,me());save();closeSheet();render();toast('양식을 바꿨어요')},
  memAdd:()=>{const n=document.getElementById('nm-name').value.trim(),e=document.getElementById('nm-email').value.trim().toLowerCase(),err=document.getElementById('nm-err');
    if(!n||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){err.textContent='이름과 이메일을 정확히 적어 주세요.';err.hidden=false;return}
    if(mem(e)){err.textContent='이미 등록된 이메일이에요.';err.hidden=false;return}
    const used=new Set(S.members.map(m=>+m.color));let c=0;while(used.has(c)&&c<MCOL.length-1)c++;
    S.members.push({id:e,name:n,role:'member',color:c});save();settingsSheet();render();toast(`${n}님을 추가했어요`)},
  memDel:b=>{if(ui.armed!=='mem'+b.dataset.id){ui.armed='mem'+b.dataset.id;b.style.color='var(--fail)';toast('한 번 더 누르면 삭제돼요. 맡은 업무는 남아요');return}
    S.members=S.members.filter(m=>m.id!==b.dataset.id);save();settingsSheet();render()},
  backup:()=>{const o={};COLS.forEach(k=>o[k]=S[k]);o.v=1;download(`플러스기획_백업_${today()}.json`,JSON.stringify(o,null,1),'application/json')},
  resetDemo:()=>{S=seed();COLS.forEach(rebase);ui.who=null;ui.logWho=null;ui.proj=null;ui.meet=null;saveLocal();closeSheet();render();toast('예시 데이터를 처음 상태로 돌렸어요')},
  signIn:()=>{cloud.msg='';signIn()},
  signOut:()=>{closeSheet();stopListeners();firebase.auth().signOut()},
  reload:()=>location.reload(),
  goTeam:()=>{ui.tab='team';ui.teamView='today';render();scrollTo(0,0)},
  teamView:b=>{ui.teamView=b.dataset.v;render()},
  taSt:b=>{ui.ta.st=b.dataset.v;render()},
  takeOver:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;const T=today(),aw=S.leaves.find(l=>l.member===t.assignee&&l.start<=T&&l.end>=T);
    openSheet(`${head('대신하기')}<p class="note" style="margin:0"><b>${esc(mname(t.assignee))}</b>님의 업무를 내가 맡아요. 담당자가 나로 바뀌고 이관 기록과 알림이 남아요.</p><div class="ver"><b>${esc(tLabel(t))}</b><span class="note">${t.due?md(t.due)+' 마감':''}</span></div><label class="fld">인계 메모<textarea id="tk-why">${esc(mname(t.assignee))} ${aw?esc(aw.type):'부재'}로 대신 처리</textarea></label><div class="btns"><button class="btn pri" data-act="takeOverGo" data-id="${t.id}" style="flex:1">내가 맡기</button></div>`)},
  takeOverGo:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;const from=t.assignee;pushH(t,'handover',`${mname(from)} → ${mname(me())}`,{from,to:me(),reason:document.getElementById('tk-why').value.trim()});t.assignee=me();save();closeSheet();render();toast('내 업무로 가져왔어요')},
  approveTask:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t||t.status!=='review')return;if(t.reviewer!==me()&&!isAdmin()){toast('확인자만 확인할 수 있어요');return}
    t.status='done';t.doneAt=t.submitAt||today();pushH(t,'review','확인 완료',{to:'done'});save();closeSheet();render();toast('확인 완료했어요')},
  rejectTask:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;const r=((document.getElementById('t-rej')||{}).value||'').trim();
    t.status='todo';delete t.submitAt;pushH(t,'review','반려'+(r?': '+r:''),{to:'todo'});save();closeSheet();render();toast('반려했어요. 담당자에게 알림이 가요')},
  postpone:b=>postponeTo(b.dataset.id,b.dataset.to),
  guide:b=>{const g=S.guides.find(x=>x.id===b.dataset.id);if(g)guideView(g)},
  guideNew:()=>guideEditSheet(null),
  guideEdit:b=>guideEditSheet(S.guides.find(x=>x.id===b.dataset.id)),
  guideSubmit:()=>{if(!isAdmin())return;const g=id=>document.getElementById(id),cat=g('gd-cat').value,title=g('gd-title').value.trim(),body=g('gd-body').value;
    if(!title||!body.trim()){g('gd-err').hidden=false;return}
    applyGuide({guideId:ui.draft.gid,cat,title,body});save();closeSheet();render();toast('가이드를 저장했어요')},
  guideDel:b=>{if(ui.armed!=='g'+b.dataset.id){ui.armed='g'+b.dataset.id;b.classList.add('arm');b.textContent='한 번 더 누르면 삭제';return}
    S.guides=S.guides.filter(x=>x.id!==b.dataset.id);save();closeSheet();render();toast('삭제했어요. 수정 기록에서 되살릴 수 있어요')},
  guideSeed:()=>{if(!isAdmin())return;S.guides=DEF_GUIDES();save();render()},
  gcat:b=>{ui.gcat=b.dataset.c;render()},
  addPlan:b=>{const p=proj(b.dataset.id);if(!p)return;const r=addPlanTasks(p);save();render();toast(r.n?`표준 업무 ${r.n}개를 넣었어요`+(r.skip?` (지난 날짜 ${r.skip}개 제외)`:''):'더 넣을 표준 업무가 없어요')},
  contactAdd:b=>{const p=proj(b.dataset.pid);if(p)contactSheet(p)},
  contactEdit:b=>{const p=proj(b.dataset.pid),c=p&&(p.contacts||[]).find(x=>x.id===b.dataset.cid);if(c)contactSheet(p,c)},
  contactSave:()=>{const g=id=>document.getElementById(id),p=proj(ui.draft.pid);if(!p)return;const name=g('c-name').value.trim();if(!name){g('f-err').hidden=false;return}
    const rec={role:g('c-role').value,name,phone:g('c-phone').value.trim(),memo:g('c-memo').value.trim()};p.contacts=p.contacts||[];
    const c=p.contacts.find(x=>x.id===ui.draft.cid);if(c)Object.assign(c,rec);else p.contacts.push(Object.assign({id:uid()},rec));save();closeSheet();render();toast('저장했어요')},
  contactDel:b=>{if(ui.armed!=='contact'){ui.armed='contact';b.classList.add('arm');b.textContent='한 번 더 누르면 삭제';return}
    const p=proj(ui.draft.pid);if(p)p.contacts=(p.contacts||[]).filter(x=>x.id!==ui.draft.cid);save();closeSheet();render()},
  contacts:b=>{const p=proj(b.dataset.pid);if(!p)return;openSheet(`${head('연락처')}<p class="note" style="margin:0">${esc(p.name)} · 번호를 누르면 바로 전화해요</p><div class="card list">${contactsHtml(p,true)}</div>`,true)},
  photo:b=>{const ph=S.photos.find(x=>x.id===b.dataset.id);if(!ph)return;openSheet(`${head('사진')}<img src="${ph.data}" alt="현장 사진" style="width:100%;border-radius:12px"><p class="note" style="margin:0">${esc(mname(ph.by))} · ${hm(ph.at)}</p>${ph.by===me()||isAdmin()?`<div class="btns"><button class="btn danger" data-act="photoDel" data-id="${ph.id}">사진 삭제</button></div>`:''}`,true)},
  photoDel:b=>{if(ui.armed!=='photo'){ui.armed='photo';b.classList.add('arm');b.textContent='한 번 더 누르면 삭제';return}
    S.photos=S.photos.filter(x=>x.id!==b.dataset.id);save();closeSheet();render();toast('사진을 지웠어요')},
  present:()=>{const m=curMeet();if(!m)return;ui.pres={mid:m.id,i:0,follow:true,zoom:''};renderPresent()},
  pv:b=>{if(!ui.pres)return;const m=S.meetings.find(x=>x.id===ui.pres.mid);ui.pres.i+=+b.dataset.n;ui.pres.zoom='';
    if(m&&m.live&&m.live.by===me()){ui.pres.i=Math.max(0,Math.min(ui.pres.i,slidesOf(m).length-1));m.live={by:me(),i:ui.pres.i,at:nowISO()};save()}else ui.pres.follow=false;
    renderPresent()},
  pvLead:()=>{const m=ui.pres&&S.meetings.find(x=>x.id===ui.pres.mid);if(!m)return;if(m.live&&m.live.by===me())delete m.live;else m.live={by:me(),i:ui.pres.i,at:nowISO()};save();renderPresent()},
  pvClose:()=>{const m=ui.pres&&S.meetings.find(x=>x.id===ui.pres.mid);if(m&&m.live&&m.live.by===me()){delete m.live;save()}ui.pres=null;renderPresent()},
  pvZoom:b=>{if(ui.pres){ui.pres.zoom=b.dataset.id||'';renderPresent()}},
  printMeet:()=>{const m=curMeet();if(m)printMeet(m)},
  approveMeet:()=>{const m=curMeet();if(!m||!isApprover())return;if(m.approval)delete m.approval;else m.approval={by:me(),at:nowISO()};save();render();toast(m.approval?'수석 확인을 남겼어요':'수석 확인을 취소했어요')},
  qaAdd:()=>{const el=document.getElementById('qa');if(!el)return;const v=el.value.trim();if(!v){el.focus();return}
    const r=parseQuick(v,el.dataset.pid,qaWho());if(!r.title){toast('할 일을 적어 주세요');return}
    S.tasks.push(mkTask(r));el.value='';save();render();const p=proj(r.projectId);
    toast(`${p?'['+p.name+'] ':''}${r.title} · ${md(r.due)}(${dowOf(r.due)}) · ${mname(r.assignee)}`+(r.warn.length?' — '+r.warn.join(', '):''));
    const n=document.getElementById('qa');if(n&&!('ontouchstart' in window))n.focus()},
  qaBulk:()=>{const el=document.getElementById('qa');bulkSheet(el?el.dataset.pid:'',el?el.value:'')},
  qaBulkGo:()=>{const lines=document.getElementById('qa-bulk').value.split('\n').map(x=>x.replace(/^\s*(?:[-•*·▪]|\d+[.)])\s+/,'').trim()).filter(Boolean);
    if(!lines.length){document.getElementById('f-err').hidden=false;return}
    let w=0,n=0;lines.forEach(l=>{const r=parseQuick(l,ui.draft.pid,ui.draft.who);if(!r.title)return;if(r.warn.length)w++;S.tasks.push(mkTask(r));n++});
    save();closeSheet();render();toast(`업무 ${n}개를 등록했어요`+(w?` · ${w}개는 프로젝트나 담당자를 못 찾았어요`:''))},
  postponeAll:b=>{const T=today(),to=b.dataset.to,who=me();let n=0;
    S.tasks.filter(t=>t.assignee===who&&t.status==='todo'&&t.due&&t.due<T).forEach(t=>{const from=t.due,r=t.missed&&t.missed.d===T?t.missed.reason||'':'';t.missed={d:T,reason:r,to};t.due=to;pushH(t,'postpone',`${md(from)} → ${md(to)}`,{reason:r});n++});
    save();render();toast(`밀린 업무 ${n}건을 ${md(to)}로 옮겼어요`)},
  noticeView:b=>{ui.nv=b.dataset.v;noticeSheet()},
  revClear:()=>{ui.draft.reviewer='';const l=document.getElementById('t-revline');if(l)l.remove()},
  close:()=>closeSheet()
};
const CHG={
  who:v=>{ui.who=v;render()},
  logWho:v=>{ui.logWho=v;render()},
  demoMe:v=>{S.demoMe=v;ui.who=null;ui.logWho=null;saveLocal();settingsSheet();render();toast(`${mname(v)}(으)로 보고 있어요`)},
  memName:(v,el)=>{const m=mem(el.dataset.id);if(m&&v.trim()){m.name=v.trim();save();render()}},
  tWho:v=>{const w=document.getElementById('t-ho-wrap');if(w)w.hidden=!ui.draft.id||v===ui.draft.assignee},
  ta:(v,el)=>{ui.ta[el.dataset.k]=el.type==='checkbox'?el.checked:v;render()},
  postpone:(v,el)=>postponeTo(el.dataset.id,v),
  pvFollow:(v,el)=>{if(ui.pres){ui.pres.follow=el.checked;renderPresent()}}
};
function onLive(el){
  const k=el.dataset.live;
  if(k==='site'){const m=curMeet(),c=m&&(m.site||[]).find(x=>x.id===el.dataset.c);if(c){c.v=el.value;save()}}
  else if(k==='rep'){const m=curMeet();if(m&&m.report[+el.dataset.i]){m.report[+el.dataset.i].v=el.value;save()}}
  else if(k==='act'){const m=curMeet(),a=m&&(m.actions||[]).find(x=>x.id===el.dataset.a);if(a){a[el.dataset.f]=el.value;save()}}
  else if(k==='miss'){const t=S.tasks.find(x=>x.id===el.dataset.id);if(t){const T=today(),o=t.missed&&t.missed.d===T?t.missed:{d:T};o.reason=el.value;t.missed=o;save()}}
  else if(k==='log'){const d=logDocEnsure(me(),ui.logDate);d.notes[el.dataset.k]=el.value;save()}
}
document.addEventListener('click',e=>{
  if(e.target.matches('[data-scrim]')){closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList.contains('live')&&el.tagName!=='SELECT'&&el.type!=='date')onLive(el);
    if(el.id==='t-title'){const er=document.getElementById('f-err');if(er)er.hidden=true}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.classList.contains('live')&&(el.tagName==='SELECT'||el.type==='date'))onLive(el);
  if(el.dataset.chg&&CHG[el.dataset.chg])CHG[el.dataset.chg](el.value,el);
  if(el.dataset.photo&&el.files&&el.files.length){const m=curMeet();if(m)addPhotos(m,el.dataset.photo,el.files);el.value=''}
  if(el.id==='restoreFile'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;COLS.filter(k=>k!=='changes').forEach(k=>S[k]=Array.isArray(d[k])?d[k]:[]);save();closeSheet();render();toast('복원했어요. 복원 전 내용은 수정 기록에 남아요')}catch(x){toast('백업 파일을 읽지 못했어요')}};r.readAsText(el.files[0])}
});
document.addEventListener('keydown',e=>{
  if(ui.pres&&!document.querySelector('.sheet')){if(e.key==='ArrowRight'){A.pv({dataset:{n:'1'}});return}if(e.key==='ArrowLeft'){A.pv({dataset:{n:'-1'}});return}if(e.key==='Escape'){if(ui.pres.zoom)A.pvZoom({dataset:{id:''}});else A.pvClose();return}}
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&!e.isComposing){
    if(e.target.id==='qa'){e.preventDefault();A.qaAdd()}
    else if(e.target.id==='ck-new'){e.preventDefault();A.ckAdd()}
    else if(e.target.id==='sck-new'){e.preventDefault();A.sckAdd()}
    else if(e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click()}
  }
});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('live'))setTimeout(()=>{const a=document.activeElement;if(!(a&&a.classList&&a.classList.contains('live'))&&!document.querySelector('.sheet'))queueRender()},150)});
let tx=null;
document.addEventListener('touchstart',e=>{tx=ui.pres&&e.touches.length===1?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(ui.pres&&tx!=null&&!ui.pres.zoom){const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)A.pv({dataset:{n:dx<0?'1':'-1'}})}tx=null},{passive:true});
document.addEventListener('paste',e=>{if(e.target.id!=='qa')return;const t=((e.clipboardData||window.clipboardData).getData('text')||'').trim();if(/\n/.test(t)){e.preventDefault();bulkSheet(e.target.dataset.pid,t)}});
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60000);
window.addEventListener('pagehide',()=>{if(pushT)flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(pushT)flush()}else queueRender()});
if(!CFG)setTimeout(()=>{firstLoad=false},500);
render();
initCloud();
})();
</script>
</body>
</html>
